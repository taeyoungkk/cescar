spring.application.name=Backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ssafy
spring.datasource.username=ssafy
spring.datasource.password=ssafy
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# MQTT Settings
logging.level.org.springframework.integration=TRACE
logging.level.org.springframework.integration.mqtt=TRACE
logging.level.org.eclipse.paho.client.mqttv3=TRACE
logging.level.org.springframework.messaging=TRACE
logging.level.org.springframework.integration.handler=TRACE
