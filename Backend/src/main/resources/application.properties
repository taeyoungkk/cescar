spring.application.name=Backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ssafy?stringtype=unspecified
spring.datasource.username=ssafy
spring.datasource.password=ssafy
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# MQTT Settings
mqtt.broker.url=tcp://localhost:8085
mqtt.username=spring_client
mqtt.password=qwer1234
mqtt.inbound.topic=robot/#

# Logging Settings
#logging.level.org.springframework.integration=TRACE
#logging.level.org.springframework.integration.mqtt=TRACE
#logging.level.org.eclipse.paho.client.mqttv3=TRACE
#logging.level.org.springframework.messaging=TRACE
#logging.level.org.springframework.integration.handler=TRACE


# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
# Exclude entity packages from schema generation to avoid circular references
springdoc.packages-to-exclude=com.ssafy.backend.domain.*.domain

storage.signed-url-ttl=10m
storage.allowed-hosts=storage.googleapis.com
gcs.project-id=${GCS_PROJECT_ID:}
gcs.bucket=${GCS_BUCKET:}
gcs.credentials-path=${GCS_CREDENTIALS_PATH:}
